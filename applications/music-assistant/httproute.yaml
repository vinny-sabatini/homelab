---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/hostname: music-assistant.vinnysabatini.me
  labels:
    app.kubernetes.io/name: music-assistant
  name: music-assistant
spec:
  hostnames:
  - music-assistant.vinnysabatini.me
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: cluster-gateway
    namespace: kube-system
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: music-assistant
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
