---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  labels:
    app.kubernetes.io/instance: external-secrets-webhook
    app.kubernetes.io/name: external-secrets-webhook
  name: external-secrets-webhook
spec:
  resourcePolicy:
    containerPolicies:
    - containerName: webhook
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets-webhook
  updatePolicy:
    updateMode: "Off"
