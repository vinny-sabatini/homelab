serviceMonitor:
  enabled: true
  selfMonitor:
    enabled: true
verticalPodAutoscaler:
  enabled: true
  updatePolicy:
    updateMode: "Off"
config:
  modules:
    tcp_connect:
      prober: tcp
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: "ip4"
# TODO: Use trust-manager for ca cluster bundles
        tls_config:
          insecure_skip_verify: true
# extraConfigmapMounts:
#   - name: kube-root-ca
#     mountPath: /etc/secrets/ssl/
#     subPath: ca.crt
#     configMap: kube-root-ca.crt
#     readOnly: true
#     defaultMode: 420
# extraVolumeMounts:
#   - name: kube-root-ca
#     mountPath: /etc/ssl/certs/kube-root-ca.crt
route:
  main:
    enabled: true
    annotations:
      external-dns.alpha.kubernetes.io/hostname: blackbox-exporter.vinnysabatini.me
    hostnames:
    - blackbox-exporter.vinnysabatini.me
    parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cluster-gateway
      namespace: kube-system
