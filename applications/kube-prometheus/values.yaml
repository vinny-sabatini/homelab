fullnameOverride: kube-prom
kubeProxy:
  enabled: false
kubeEtcd:
  service:
    enabled: true
    port: 2381
    targetPort: 2381
    selector:
      k8s-app: kube-controller-manager # or any other service like kube-proxy or kube-scheduler
  serviceMonitor:
    scheme: http
prometheusOperator:
  verticalPodAutoscaler:
    enabled: true
    updatePolicy:
      updateMode: "Off"
prometheus:
  route:
    main:
      enabled: true
      annotations:
        external-dns.alpha.kubernetes.io/hostname: prometheus.vinnysabatini.me
      hostnames:
      - "prometheus.vinnysabatini.me"
      parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: cluster-gateway
        namespace: kube-system
      rules:
      - matches:
        - path:
            type: PathPrefix
            value: /
        backendRefs:
        - name: prometheus-operated
          port: 9090
  verticalPodAutoscaler:
    enabled: true
    updatePolicy:
      updateMode: "Off"
  prometheusSpec:
    podMetadata:
      annotations:
        match-regex.version-checker.io/prometheus: "v(\\d+)\\.(\\d+)\\.(\\d+)"
    secrets:
      - etcd-client-cert
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    probeSelectorNilUsesHelmValues: false
    probeNamespaceSelector: {}
    scrapeConfigSelectorNilUsesHelmValues: false
    scrapeConfigNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          resources:
            requests:
              storage: 40Gi
grafana:
  enabled: false
  forceDeployDashboards: true
alertmanager:
  route:
    main:
      enabled: true
      annotations:
        external-dns.alpha.kubernetes.io/hostname: alertmanager.vinnysabatini.me
      hostnames:
      - "alertmanager.vinnysabatini.me"
      parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: cluster-gateway
        namespace: kube-system
      rules:
      - matches:
        - path:
            type: PathPrefix
            value: /
        backendRefs:
        - name: alertmanager-operated
          port: 9093
  verticalPodAutoscaler:
    enabled: true
    updatePolicy:
      updateMode: "Off"
  alertmanagerSpec:
    alertmanagerConfiguration:
      name: global-alertmanager-configuration
