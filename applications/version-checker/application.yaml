---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: version-checker
  namespace: argocd
  finalizers:
    # The default behaviour is foreground cascading deletion
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    path: applications/version-checker
    repoURL: 'https://github.com/vinny-sabatini/homelab.git'
    targetRevision: main
    kustomize:
      patches:
      - target:
          kind: GrafanaDashboard
          name: version-checker-general
        patch: |-
          - op: replace
            path: /spec/allowCrossNamespaceImport
            value: true
      - target:
          kind: GrafanaDashboard
          name: version-checker-internal
        patch: |-
          - op: replace
            path: /spec/allowCrossNamespaceImport
            value: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
