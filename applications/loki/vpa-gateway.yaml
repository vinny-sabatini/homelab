---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  labels:
    app.kubernetes.io/instance: loki-gateway
    app.kubernetes.io/name: loki-gateway
    app.kubernetes.io/part-of: loki
  name: loki-gateway
spec:
  resourcePolicy:
    containerPolicies:
    - containerName: nginx
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loki-gateway
  updatePolicy:
    updateMode: "Off"
