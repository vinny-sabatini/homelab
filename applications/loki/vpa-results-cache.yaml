---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  labels:
    app.kubernetes.io/instance: loki-results-cache
    app.kubernetes.io/name: loki-results-cache
    app.kubernetes.io/part-of: loki
  name: loki-results-cache
spec:
  resourcePolicy:
    containerPolicies:
    - containerName: memcached
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: loki-results-cache
  updatePolicy:
    updateMode: "Off"
