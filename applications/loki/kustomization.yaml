apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- Bucket-loki-storage.yaml
- BucketClaim-loki-storage.yaml
- vpa-canary.yaml
- vpa-chunks-cache.yaml
- vpa-gateway.yaml
- vpa-results-cache.yaml
- vpa.yaml

helmCharts:
  - name: loki
    repo: https://grafana-community.github.io/helm-charts
    version: 18.13.7
    valuesFile: values.yaml
    namespace: loki
    releaseName: loki
