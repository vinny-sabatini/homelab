---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    chart: argo-cd
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 10.3.0
    helm:
      releaseName: cluster
      values: |
        configs:
          cm:
            kustomize.buildOptions: --enable-helm
        fullnameOverride: argocd
        controller:
          vpa:
            enabled: true
            updateMode: "Off"
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
            rules:
              enabled: false
            clusterRoleRules:
              enabled: true
        dex:
          enabled: false
        redis:
          vpa:
            enabled: true
            updateMode: "Off"
          exporter:
            enabled: true
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
            rules:
              enabled: false
            clusterRoleRules:
              enabled: true
        server:
          vpa:
            enabled: true
            updateMode: "Off"
          extraArgs:
          - --insecure # Allow gateway to terminate TLS instead of ArgoCD
          httproute:
            enabled: true
            annotations:
              external-dns.alpha.kubernetes.io/hostname: argocd.vinnysabatini.me
            hostnames:
            - "argocd.vinnysabatini.me"
            parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: cluster-gateway
              namespace: kube-system
            rules:
            - matches:
              - path:
                  type: PathPrefix
                  value: /
              backendRefs:
              - name: argocd-server
                port: 443
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
            rules:
              enabled: false
            clusterRoleRules:
              enabled: true
        repoServer:
          vpa:
            enabled: true
            updateMode: "Off"
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
            rules:
              enabled: false
            clusterRoleRules:
              enabled: true
        applicationSet:
          vpa:
            enabled: true
            updateMode: "Off"
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
            rules:
              enabled: false
            clusterRoleRules:
              enabled: true
        notifications:
          argocdUrl: https://argocd.vinnysabatini.me
          notifiers:
            service.webhook.discord: |
              url: $discord-homelab-events-webhook
              headers:
              - name: Content-Type
                value: application/json
          subscriptions:
          - recipients:
            - discord
            triggers:
            - on-deployed
          templates:
            template.app-deployed: |
              webhook:
                discord:
                  method: POST
                  body: >
                    {
                      "embeds": [
                        {
                          "title": "🚀 Application {{.app.metadata.name}} successfully deployed",
                          "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
                          "color": 65280,
                          "fields": [
                            {
                              "name": "Repository",
                              "value": "{{.app.spec.source.repoURL}}"
                            },
                            {
                              "name": "Revision",
                              "value": "{{.app.status.sync.revision}}"
                            }
                          ]
                        }
                      ]
                    }
          triggers:
            trigger.on-deployed: |
              - description: Application is synced and healthy. Triggered once per commit.
                oncePer: app.status.operationState?.syncResult?.revision
                send:
                - app-deployed
                when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded']
                  and app.status.health.status == 'Healthy' and (!time.Parse(app.status.health.lastTransitionTime).Add(1
                  * time.Minute).Before(time.Parse(app.status.operationState.finishedAt)) or time.Parse(app.status.health.lastTransitionTime).Before(time.Parse(app.status.operationState.startedAt)))
          secret:
            create: false
          vpa:
            enabled: true
            updateMode: "Off"
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
            rules:
              enabled: false
            clusterRoleRules:
              enabled: true
        extraObjects:
        - |
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: argocd-notifications-secret
          spec:
            refreshInterval: 1h0m0s
            secretStoreRef:
              name: bitwarden-secretsmanager
              kind: ClusterSecretStore
            data:
              - secretKey: discord-homelab-events-webhook
                remoteRef:
                  key: "discord_homelab_events_webhook"
                  metadataPolicy: None
                  decodingStrategy: None
                  conversionStrategy: Default
                  nullBytePolicy: Ignore
        - |
          apiVersion: monitoring.coreos.com/v1
          kind: PrometheusRule
          metadata:
            name: argocd-alerts
            namespace: argocd
          spec:
            groups:
              - name: argocd.critical
                rules:
                  # ArgoCD components down
                  - alert: ArgocdControllerDown
                    expr: absent(up{job="argocd-application-controller-metrics"} == 1)
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "ArgoCD Application Controller is down"
                      description: "No ArgoCD Application Controller instance is running. Syncs will not occur."

                  - alert: ArgocdServerDown
                    expr: absent(up{job="argocd-server-metrics"} == 1)
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "ArgoCD API Server is down"
                      description: "ArgoCD API Server is not responding. UI and CLI access is unavailable."

                  - alert: ArgocdRepoServerDown
                    expr: absent(up{job="argocd-repo-server-metrics"} == 1)
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "ArgoCD Repo Server is down"
                      description: "Repo Server is not responding. Manifest generation will fail."

                  # Production application failures
                  - alert: ArgocdProductionAppDegraded
                    expr: |
                      argocd_app_info{health_status="Degraded"} == 1
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Production application {{ ` {{ $labels.name }} ` }} is degraded"
                      description: "Application {{ ` {{ $labels.name }} ` }} in {{ ` {{ $labels.dest_namespace }} ` }} has been degraded for 5 minutes."
              - name: argocd.warning
                rules:
                  # Applications out of sync
                  - alert: ArgocdAppOutOfSync
                    expr: |
                      argocd_app_info{sync_status=~"OutOfSync|Unknown"} == 1
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Application {{ ` {{ $labels.name }} ` }} is out of sync for 30 minutes"

                  # Sync failures
                  - alert: ArgocdSyncFailed
                    expr: |
                      increase(argocd_app_sync_total{phase=~"Error|Failed"}[1h]) > 3
                    labels:
                      severity: warning
                    annotations:
                      summary: "Application {{ ` {{ $labels.name }} ` }} has failed to sync 3+ times in the last hour"

                  # Git fetch errors
                  - alert: ArgocdGitFetchErrors
                    expr: |
                      increase(argocd_git_fetch_fail_total[15m]) > 5
                    labels:
                      severity: warning
                    annotations:
                      summary: "ArgoCD is experiencing Git fetch errors"

                  # High reconciliation time
                  - alert: ArgocdSlowReconciliation
                    expr: |
                      histogram_quantile(0.95, sum(rate(argocd_app_reconcile_bucket[5m])) by (le)) > 120
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "ArgoCD reconciliation P95 latency is above 2 minutes"

                  # Redis connection issues
                  - alert: ArgocdRedisConnectionErrors
                    expr: |
                      increase(argocd_redis_request_total{failed="true"}[5m]) > 0
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "ArgoCD is experiencing Redis connection errors"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
