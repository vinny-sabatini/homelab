httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cluster-gateway
      namespace: kube-system
  hostnames:
    - home-assistant.vinnysabatini.me
  matches:
    - path:
        type: PathPrefix
        value: /
persistence:
  enabled: true
  accessMode: ReadWriteMany
  size: 5Gi
  storageClass: seaweedfs
serviceMonitor:
  enabled: true
  requiresAuth: false
  scrapeInterval: 30s
configuration:
  enabled: true
  forceInit: true
  templateConfig: |-
    default_config:
      prometheus:
        requires_auth: false
      frontend:
        themes: !include_dir_merge_named themes
      logger:
        default: debug
      automation: !include automations.yaml
      script: !include scripts.yaml
      scene: !include scenes.yaml
