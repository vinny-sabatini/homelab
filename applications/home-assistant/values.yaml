httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cluster-gateway
      namespace: kube-system
  hostnames:
    - home-assistant.vinnysabatini.me
  matches:
    - path:
        type: PathPrefix
        value: /
persistence:
  enabled: true
  accessMode: ReadWriteMany
  size: 5Gi
  storageClass: seaweedfs
serviceMonitor:
  enabled: true
  requiresAuth: false
  scrapeInterval: 30s
configuration:
  enabled: true
  forceInit: true
startupProbe:
  initialDelaySeconds: 120
  failureThreshold: 3
  httpGet:
    path: /
    port: http
    scheme: HTTP
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 1
