httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cluster-gateway
      namespace: kube-system
  hostnames:
    - home-assistant.vinnysabatini.me
  matches:
    - path:
        type: PathPrefix
        value: /
persistence:
  enabled: true
  accessMode: ReadWriteMany
  size: 5Gi
  storageClass: seaweedfs
serviceMonitor:
  enabled: true
  requiresAuth: false
  scrapeInterval: 30s
configuration:
  enabled: true
  forceInit: true
  logger:
    default: debug
