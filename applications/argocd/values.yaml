configs:
  cm:
    kustomize.buildOptions: --enable-helm
fullnameOverride: argocd
controller:
  vpa:
    enabled: true
    updateMode: "Off"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    rules:
      enabled: false
    clusterRoleRules:
      enabled: true
dex:
  enabled: false
redis:
  vpa:
    enabled: true
    updateMode: "Off"
  exporter:
    enabled: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    rules:
      enabled: false
    clusterRoleRules:
      enabled: true
server:
  vpa:
    enabled: true
    updateMode: "Off"
  extraArgs:
  - --insecure # Allow gateway to terminate TLS instead of ArgoCD
  httproute:
    enabled: true
    annotations:
      external-dns.alpha.kubernetes.io/hostname: argocd.vinnysabatini.me
    hostnames:
    - "argocd.vinnysabatini.me"
    parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cluster-gateway
      namespace: kube-system
    rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
      - name: argocd-server
        port: 443
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    rules:
      enabled: false
    clusterRoleRules:
      enabled: true
repoServer:
  vpa:
    enabled: true
    updateMode: "Off"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    rules:
      enabled: false
    clusterRoleRules:
      enabled: true
applicationSet:
  vpa:
    enabled: true
    updateMode: "Off"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    rules:
      enabled: false
    clusterRoleRules:
      enabled: true
notifications:
  enabled: false
