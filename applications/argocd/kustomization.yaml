apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - externalsecret-ghcr-oci-secret.yaml
  - prometheusrules.yaml

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.18.0
    valuesFile: values.yaml
    releaseName: cluster
    namespace: argocd
    includeCRDs: true
