---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-github
  namespace: renovate-operator
spec:
  discoveryFilters:
    - vinny-sabatini/*
  provider:
    name: github
  extraEnv: []
  # renovate: datasource=docker
  image: renovate/renovate:44.239.1
  parallelism: 5
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  schedule: "*/15 * * * *"
  secretRef: renovate-secret
