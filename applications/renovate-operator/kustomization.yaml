apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- externalsecret-github-pem.yaml
- externalsecret-github-token.yaml
- githubaccesstoken.yaml
- renovatejob.yaml

helmCharts:
  - name: renovate-operator
    repo: oci://ghcr.io/mogenius/helm-charts/renovate-operator
    version: 6.9.0
    valuesFile: values.yaml
    releaseName: renovate-operator
    namespace: renovate-operator
    includeCRDs: true
