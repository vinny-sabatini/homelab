apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: home-assistant-matter-server
    repo: https://charts.derwitt.dev
    version: 4.3.0
    valuesFile: values.yaml
    releaseName: matter-server
    namespace: matter-server

patches:
  - target:
      kind: StatefulSet
      name: matter-server-home-assistant-matter-server
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/accessModes/0
        value: "ReadWriteMany"
