---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  finalizers:
    # The default behaviour is foreground cascading deletion
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    targetRevision: 1.21.1
    helm:
      releaseName: external-dns
      values: |
        policy: sync
        sources:
          - service
          - ingress
          - gateway-httproute
          - gateway-grpcroute
          - gateway-tlsroute
          - gateway-tcproute
          - gateway-udproute
        logLevel: info
        serviceMonitor:
          enabled: true
        env:
          - name: UNIFI_SKIP_TLS_VERIFY
            value: "true"
        provider:
          name: webhook
          webhook:
            image:
              repository: ghcr.io/home-operations/external-dns-unifi-webhook
              tag: 0.10.9
            env:
              - name: UNIFI_HOST
                value: https://192.168.1.1
              - name: UNIFI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: unifi-token
                    key: token
            livenessProbe:
              httpGet:
                path: /healthz
                port: http-webhook
              initialDelaySeconds: 10
              timeoutSeconds: 5
            readinessProbe:
              httpGet:
                path: /readyz
                port: http-webhook
              initialDelaySeconds: 10
              timeoutSeconds: 5
        triggerLoopOnEvent: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: external-dns
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
