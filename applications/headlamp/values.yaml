httpRoute:
  enabled: true
  annotations:
    external-dns.alpha.kubernetes.io/hostname: headlamp.vinnysabatini.me
  hostnames:
  - headlamp.vinnysabatini.me
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: cluster-gateway
    namespace: kube-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: headlamp
      port: 80
env:
- name: HEADLAMP_CONFIG_METRICS_ENABLED
  value: "true"
replicaCount: 3
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: headlamp
        topologyKey: topology.kubernetes.io/hostname
      weight: 100
config:
  watchPlugins: true
  podDebugImage: docker.io/nicolaka/netshoot:latest
  nodeShellImage: docker.io/nicolaka/netshoot:latest
pluginsManager:
  enabled: true
  configContent: |
    plugins:
      - name: argocd
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_argocd
        version: 0.1.0-alpha
      - name: cert-manager
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
        version: 0.1.1
      - name: external-secrets
        source: https://artifacthub.io/packages/headlamp/external-secrets-operator-headlamp-plugin/external-secrets-operator
        version: 0.1.0-beta7
      - name: keda
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_keda
        version: 0.1.2
      - name: theme-builder
        source: https://artifacthub.io/packages/headlamp/headlamp-theme-builder/headlamp-theme-builder
        version: 1.3.0
    installOptions:
      parallel: true
      maxConcurrent: 2
