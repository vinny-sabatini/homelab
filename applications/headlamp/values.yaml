httpRoute:
  enabled: true
  annotations:
    external-dns.alpha.kubernetes.io/hostname: headlamp.vinnysabatini.me
  hostnames:
  - headlamp.vinnysabatini.me
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: cluster-gateway
    namespace: kube-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: headlamp
      port: 80
env:
- name: HEADLAMP_CONFIG_METRICS_ENABLED
  value: "true"
replicaCount: 3
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: headlamp
        topologyKey: topology.kubernetes.io/zone
      weight: 100
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchLabels:
          app.kubernetes.io/name: headlamp
      topologyKey: kubernetes.io/hostname
