---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bambuddy
  namespace: argocd
  finalizers:
    # The default behaviour is foreground cascading deletion
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: bambuddy
    repoURL: https://npelikan.github.io/bambuddy-helm
    targetRevision: 0.1.2
    helm:
      releaseName: bambuddy
      values: |
        hostNetwork: true
        persistence:
          data:
            storageClass: "local-path"
          logs:
            storageClass: "local-path"
        extraObjects:
        - |
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            annotations:
              external-dns.alpha.kubernetes.io/hostname: bambuddy.vinnysabatini.me
            name: bambuddy
          spec:
            hostnames:
            - bambuddy.vinnysabatini.me
            parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: cluster-gateway
              namespace: kube-system
            rules:
            - backendRefs:
              - group: ""
                kind: Service
                name: bambuddy
                port: 8000
                weight: 1
              matches:
              - path:
                  type: PathPrefix
                  value: /
        - |
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            labels:
              app.kubernetes.io/managed-by: Helm
              app.kubernetes.io/name: bambuddy
              app.kubernetes.io/instance: bambuddy
            name: bambuddy
          spec:
            endpoints:
            - honorLabels: false
              interval: 30s
              path: /api/v1/metrics
              port: web
            namespaceSelector:
              matchNames:
              - bambuddy
            selector:
              matchLabels:
                app.kubernetes.io/instance: bambuddy
                app.kubernetes.io/name: bambuddy

  destination:
    server: "https://kubernetes.default.svc"
    namespace: bambuddy
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: "privileged"
