---
apiVersion: seaweed.seaweedfs.com/v1
kind: SeaweedCSIDriver
metadata:
  name: seaweedfs
spec:
  seaweedRef:
    name: seaweed
  driverName: seaweedfs-csi-driver
  storageClass:
    name: seaweedfs
    isDefaultClass: false
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      replication: "000"
  sidecars:
    provisioner: registry.k8s.io/sig-storage/csi-provisioner:v6.4.0
    resizer: registry.k8s.io/sig-storage/csi-resizer:v2.3.0
    attacher: registry.k8s.io/sig-storage/csi-attacher:v4.13.0
    nodeDriverRegistrar: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
    livenessProbe: registry.k8s.io/sig-storage/livenessprobe:v2.20.0
