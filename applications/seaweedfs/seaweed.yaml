---
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweed
  namespace: seaweedfs
spec:
  image: ghcr.io/chrislusf/seaweedfs:4.48
  master:
    replicas: 3
    volumeSizeLimitMB: 1024
    metricsPort: 8080
  volume:
    replicas: 0
    kind: DaemonSet
    metricsPort: 8080
    hostPath:
      - path: /var/mnt/seaweedfs
    nodeSelector:
      kubernetes.io/os: linux
  filer:
    replicas: 1
    metricsPort: 8080
    config: |
      [leveldb2]
      enabled = true
      dir = "/data/filerldb2"
  s3:
    replicas: 1
    metricsPort: 8080
